<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dan Peck</title>
  <meta name="description" content="Dan Peck – ML Engineer in AdTech.">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --accent: #0969da;
      --border: #d1d9e0;
      --hover: #f6f8fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #e6edf3;
        --muted: #9198a1;
        --accent: #4493f8;
        --border: #30363d;
        --hover: #161b22;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 48px 16px;
      text-align: center;
    }
    h1 {
      font-size: clamp(2.25rem, 8vw, 3rem);
      letter-spacing: -0.02em;
      margin: 0;
    }
    .title {
      color: var(--muted);
      font-size: 1.15rem;
      margin: 8px 0 32px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    nav a {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      transition: border-color .15s, background .15s, color .15s;
    }
    nav a:hover, nav a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--hover);
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Dan Peck</h1>
    <p class="title">ML Engineer · AdTech</p>

    <nav aria-label="Links">
      <ul>
        <li><a href="https://github.com/dpeck12">GitHub</a></li>
        <!-- TODO: replace placeholder links -->
        <li><a href="#">LinkedIn</a></li>
        <li><a href="#">Email</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
